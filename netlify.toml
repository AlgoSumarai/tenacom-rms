[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly enable the adapter for this nested Next.js application.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set API_URL to the HTTPS Render API address in Netlify environment settings.
# The existing Next.js /api rewrite uses a build-time value.
